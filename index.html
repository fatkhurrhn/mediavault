<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaVault · File Explorer</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- RemixIcon CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />

    <!-- Custom font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        /* Smooth scroll and hide scrollbar */
        html {
            scroll-behavior: smooth;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        /* Glassmorphism effects */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(51, 65, 85, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        /* Category header gradient */
        .category-gradient {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2) 0%, rgba(124, 58, 237, 0.2) 100%);
            border-left: 4px solid #6366f1;
        }

        /* Button animation */
        .copy-btn {
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        /* Shimmer animation for header */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            background-size: 1000px 100%;
            animation: shimmer 8s infinite linear;
        }

        /* Pulse animation for active elements */
        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            }

            50% {
                box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
            }
        }

        .pulse-glow {
            animation: pulse-glow 3s infinite;
        }

        @keyframes blob {

            0%,
            100% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>

<body class="bg-[#0a0a0f] min-h-screen p-4 md:p-6 lg:p-8 relative overflow-x-hidden">

    <!-- Animated background blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div
            class="absolute -top-40 -right-40 w-96 h-96 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob">
        </div>
        <div
            class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000">
        </div>
        <div
            class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-pink-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000">
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto relative z-10">

        <!-- Header with glass effect -->
        <div class="glass rounded-2xl p-6 md:p-8 mb-6 md:mb-8 pulse-glow">
            <div class="flex items-center gap-3 mb-3">
                <div
                    class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                    <i class="ri-folders-line text-2xl text-white"></i>
                </div>
                <div>
                    <h1
                        class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                        MediaVault
                    </h1>
                    <p class="text-gray-400 text-sm md:text-base mt-1 flex items-center gap-2">
                        <i class="ri-stack-line"></i>
                        <span id="totalFiles">0</span> files ·
                        <i class="ri-folder-open-line"></i>
                        <span id="currentDomain" class="font-mono text-xs bg-black/30 px-2 py-1 rounded"></span>
                    </p>
                </div>
            </div>

            <!-- Quick copy all buttons -->
            <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-white/10">
                <button onclick="copyAllLinks('audio')"
                    class="copy-btn px-4 py-2 rounded-xl text-white text-sm font-medium flex items-center gap-2 hover:shadow-lg transition-all">
                    <i class="ri-file-copy-line"></i>
                    Copy All Audio
                </button>
                <button onclick="copyAllLinks('gif')"
                    class="copy-btn px-4 py-2 rounded-xl text-white text-sm font-medium flex items-center gap-2 hover:shadow-lg transition-all">
                    <i class="ri-file-copy-line"></i>
                    Copy All GIFs
                </button>
                <button onclick="copyAllLinks('img')"
                    class="copy-btn px-4 py-2 rounded-xl text-white text-sm font-medium flex items-center gap-2 hover:shadow-lg transition-all">
                    <i class="ri-file-copy-line"></i>
                    Copy All Images
                </button>
                <button onclick="copyAllLinks('vid')"
                    class="copy-btn px-4 py-2 rounded-xl text-white text-sm font-medium flex items-center gap-2 hover:shadow-lg transition-all">
                    <i class="ri-file-copy-line"></i>
                    Copy All Videos
                </button>
            </div>
        </div>

        <!-- Categories Grid -->
        <div class="space-y-6 md:space-y-8">

            <!-- Audio Section -->
            <div id="audioSection" class="glass-card rounded-2xl p-5 md:p-6 hidden">
                <div class="category-gradient rounded-xl p-4 mb-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-orange-500/20 flex items-center justify-center">
                        <i class="ri-music-2-line text-xl text-orange-400"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-white">Audio Files</h2>
                        <p class="text-xs text-gray-400"><span id="audioCount">0</span> tracks</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3" id="audioList"></div>
            </div>

            <!-- GIF Section -->
            <div id="gifSection" class="glass-card rounded-2xl p-5 md:p-6 hidden">
                <div class="category-gradient rounded-xl p-4 mb-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-green-500/20 flex items-center justify-center">
                        <i class="ri-file-gif-line text-xl text-green-400"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-white">GIF Files</h2>
                        <p class="text-xs text-gray-400"><span id="gifCount">0</span> animations</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3" id="gifList"></div>
            </div>

            <!-- Image Section -->
            <div id="imageSection" class="glass-card rounded-2xl p-5 md:p-6 hidden">
                <div class="category-gradient rounded-xl p-4 mb-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center">
                        <i class="ri-image-line text-xl text-blue-400"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-white">Image Files</h2>
                        <p class="text-xs text-gray-400"><span id="imageCount">0</span> photos</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3" id="imageList"></div>
            </div>

            <!-- Video Section -->
            <div id="videoSection" class="glass-card rounded-2xl p-5 md:p-6 hidden">
                <div class="category-gradient rounded-xl p-4 mb-4 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-red-500/20 flex items-center justify-center">
                        <i class="ri-movie-line text-xl text-red-400"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-white">Video Files</h2>
                        <p class="text-xs text-gray-400"><span id="videoCount">0</span> videos</p>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3" id="videoList"></div>
            </div>

        </div>

        <!-- Footer -->
        <div class="mt-8 text-center text-gray-500 text-sm glass rounded-xl p-4">
            <i class="ri-copyright-line"></i> MediaVault · Click <i class="ri-file-copy-line mx-1"></i> to copy full URL
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast"
        class="fixed bottom-4 right-4 glass-card rounded-xl px-4 py-3 text-white text-sm flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <i class="ri-checkbox-circle-line text-green-400"></i>
        <span id="toastMessage">Copied!</span>
    </div>

    <script>
        // File database
        const files = {
            audio: [
                '001.mp3', '002.mp3', '003.mp3', '004.mp3',
                '005.mp3', '006.mp3', '007.mp3', '008.mp3'
            ],
            gif: [
                'G01.gif', 'G02.gif', 'G03.gif', 'G04.gif',
                'G05.gif', 'G06.gif', 'G07.gif'
            ],
            images: [
                '001.jpg', 'F01.jpg', 'F02.jpg', 'F03.jpg', 'F04.jpg',
                'F05.jpg', 'F06.jpg', 'F07.jpg', 'F08.jpg', 'F09.jpg',
                'F10.jpg', 'F11.jpg', 'F12.jpg', 'F13.jpg', 'F14.jpg',
                'F15.jpg', 'F16.jpg'
            ],
            videos: [
                '001.mp4'
            ]
        };

        // Get base URL (root domain only)
        function getBaseUrl() {
            const url = window.location.href;
            // Get root URL (up to the port number)
            const match = url.match(/^(https?:\/\/[^\/]+)/);
            return match ? match[0] + '/' : url;
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2000);
        }

        // Copy to clipboard
        async function copyToClipboard(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                const originalIcon = button.innerHTML;
                button.innerHTML = '<i class="ri-check-line"></i>';
                button.classList.add('bg-green-600');

                showToast('Copied to clipboard!');

                setTimeout(() => {
                    button.innerHTML = originalIcon;
                    button.classList.remove('bg-green-600');
                }, 2000);
            } catch (err) {
                showToast('Failed to copy');
            }
        }

        // Copy all links in category
        async function copyAllLinks(category) {
            const baseUrl = getBaseUrl();
            let links = [];

            switch (category) {
                case 'audio':
                    links = files.audio.map(f => baseUrl + 'audio/' + f);
                    break;
                case 'gif':
                    links = files.gif.map(f => baseUrl + 'gif/' + f);
                    break;
                case 'img':
                    links = files.images.map(f => baseUrl + 'img/' + f);
                    break;
                case 'vid':
                    links = files.videos.map(f => baseUrl + 'vid/' + f);
                    break;
            }

            const text = links.join('\n');
            await navigator.clipboard.writeText(text);
            showToast(`Copied ${links.length} ${category} links!`);
        }

        // Render file item
        function renderFileItem(folder, file, type) {
            const baseUrl = getBaseUrl();
            const filePath = `${folder}/${file}`;
            const fullUrl = baseUrl + filePath;

            let preview = '';
            let icon = '';

            // Set icon based on type
            if (type === 'audio') icon = 'ri-music-2-line text-orange-400';
            else if (type === 'gif') icon = 'ri-file-gif-line text-green-400';
            else if (type === 'img') icon = 'ri-image-line text-blue-400';
            else if (type === 'vid') icon = 'ri-movie-line text-red-400';

            // Add preview for media
            if (type === 'audio') {
                preview = `<audio controls class="w-full h-8 mt-2 rounded-lg">
                    <source src="${filePath}" type="audio/mpeg">
                </audio>`;
            } else if (type === 'gif' || type === 'img') {
                preview = `<img src="${filePath}" alt="${file}" class="w-full h-24 object-cover rounded-lg mt-2 bg-black/30" 
                    onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLWltYWdlIj48cmVjdCB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHg9IjMiIHk9IjMiIHJ4PSIyIiByeT0iMiIvPjxjaXJjbGUgY3g9IjkuNSIgY3k9IjkuNSIgcj0iMi41Ii8+PHBhdGggZD0ibTIxIDE1LTMuMDYtMy4wNmEyIDIgMCAwIDAtMi44MyAwTDE0IDE3Ii8+PC9zdmc+'">`;
            } else if (type === 'vid') {
                preview = `<video class="w-full h-24 object-cover rounded-lg mt-2 bg-black/30" controls>
                    <source src="${filePath}" type="video/mp4">
                </video>`;
            }

            return `
                <div class="glass-card rounded-xl p-3 hover:scale-102 transition-all duration-300">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-2">
                            <i class="${icon} text-lg"></i>
                            <span class="text-white text-sm font-medium truncate max-w-[120px]">${file}</span>
                        </div>
                        <button onclick="copyToClipboard('${fullUrl}', this)" 
                            class="copy-btn w-8 h-8 rounded-lg flex items-center justify-center text-white">
                            <i class="ri-file-copy-line"></i>
                        </button>
                    </div>
                    
                    ${preview}
                    
                    <div class="mt-2 text-xs text-gray-400 truncate font-mono bg-black/30 p-2 rounded-lg">
                        ${fullUrl}
                    </div>
                </div>
            `;
        }

        // Render all files
        function renderFiles() {
            // Update domain display
            document.getElementById('currentDomain').textContent = getBaseUrl();

            // Calculate total files
            const total = files.audio.length + files.gif.length + files.images.length + files.videos.length;
            document.getElementById('totalFiles').textContent = total;

            // Render audio
            if (files.audio.length > 0) {
                document.getElementById('audioSection').classList.remove('hidden');
                document.getElementById('audioCount').textContent = files.audio.length;
                document.getElementById('audioList').innerHTML = files.audio
                    .map(f => renderFileItem('audio', f, 'audio')).join('');
            }

            // Render gif
            if (files.gif.length > 0) {
                document.getElementById('gifSection').classList.remove('hidden');
                document.getElementById('gifCount').textContent = files.gif.length;
                document.getElementById('gifList').innerHTML = files.gif
                    .map(f => renderFileItem('gif', f, 'gif')).join('');
            }

            // Render images
            if (files.images.length > 0) {
                document.getElementById('imageSection').classList.remove('hidden');
                document.getElementById('imageCount').textContent = files.images.length;
                document.getElementById('imageList').innerHTML = files.images
                    .map(f => renderFileItem('img', f, 'img')).join('');
            }

            // Render videos
            if (files.videos.length > 0) {
                document.getElementById('videoSection').classList.remove('hidden');
                document.getElementById('videoCount').textContent = files.videos.length;
                document.getElementById('videoList').innerHTML = files.videos
                    .map(f => renderFileItem('vid', f, 'vid')).join('');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderFiles);
    </script>
</body>

</html>
