<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Files Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .category {
            margin-bottom: 40px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .category h2 {
            color: #495057;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 5px solid #667eea;
        }

        .file-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .file-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .file-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .file-name {
            font-weight: 600;
            color: #495057;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-name i {
            font-size: 1.2em;
        }

        .file-path {
            background: #f1f3f5;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            color: #666;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }

        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.3s ease;
        }

        .copy-btn:hover {
            background: #5a67d8;
        }

        .copy-btn.copied {
            background: #48bb78;
        }

        .empty-message {
            color: #868e96;
            font-style: italic;
            padding: 20px;
            text-align: center;
            grid-column: 1 / -1;
        }

        .preview {
            max-width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 5px;
            margin-top: 5px;
        }

        .audio-player {
            width: 100%;
            margin-top: 5px;
        }

        .video-player {
            width: 100%;
            max-height: 150px;
            border-radius: 5px;
        }

        .icon {
            font-size: 1.2em;
        }

        .audio-icon {
            color: #f59e0b;
        }

        .video-icon {
            color: #ef4444;
        }

        .image-icon {
            color: #10b981;
        }

        .header-info {
            text-align: center;
            margin-bottom: 20px;
            color: #6c757d;
        }

        .path-info {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-family: monospace;
            text-align: center;
            font-size: 1.1em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📁 Media Files Explorer</h1>

        <div class="header-info">
            <p>Klik tombol copy untuk menyalin path file</p>
        </div>

        <div class="path-info">
            📂 Format path: <strong>folder/nama_file.ext</strong>
        </div>

        <div id="audioSection" class="category" style="display: none;">
            <h2>🎵 Audio Files</h2>
            <div class="file-list" id="audioList"></div>
        </div>

        <div id="imageSection" class="category" style="display: none;">
            <h2>🖼️ Image Files</h2>
            <div class="file-list" id="imageList"></div>
        </div>

        <div id="videoSection" class="category" style="display: none;">
            <h2>🎬 Video Files</h2>
            <div class="file-list" id="videoList"></div>
        </div>
    </div>

    <script>
        // Fungsi untuk copy teks ke clipboard
        async function copyToClipboard(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                const originalText = button.textContent;
                button.textContent = '✅ Copied!';
                button.classList.add('copied');

                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                alert('Gagal menyalin teks');
            }
        }

        // Daftar file yang diketahui
        const files = {
            audio: [
                '001.mp3', '002.mp3', '003.mp3', '004.mp3',
                '005.mp3', '006.mp3', '007.mp3', '008.mp3'
            ],
            images: [
                '001.jpg'
            ],
            videos: [
                '001.mp4'
            ]
        };

        // Render semua file
        function renderFiles() {
            const audioSection = document.getElementById('audioSection');
            const imageSection = document.getElementById('imageSection');
            const videoSection = document.getElementById('videoSection');

            // Render audio files
            if (files.audio.length > 0) {
                audioSection.style.display = 'block';
                const audioList = document.getElementById('audioList');
                audioList.innerHTML = files.audio.map(file => {
                    const filePath = `audio/${file}`;
                    return `
                        <div class="file-item">
                            <div class="file-name">
                                <span class="icon audio-icon">🎵</span>
                                ${file}
                            </div>
                            <audio controls class="audio-player">
                                <source src="${filePath}" type="audio/mpeg">
                                Browser tidak mendukung audio player
                            </audio>
                            <div class="file-path">${filePath}</div>
                            <button class="copy-btn" onclick="copyToClipboard('${filePath}', this)">
                                📋 Copy Path
                            </button>
                        </div>
                    `;
                }).join('');
            }

            // Render image files
            if (files.images.length > 0) {
                imageSection.style.display = 'block';
                const imageList = document.getElementById('imageList');
                imageList.innerHTML = files.images.map(file => {
                    const filePath = `img/${file}`;
                    return `
                        <div class="file-item">
                            <div class="file-name">
                                <span class="icon image-icon">🖼️</span>
                                ${file}
                            </div>
                            <img src="${filePath}" alt="${file}" class="preview" 
                                 onerror="this.style.display='none'">
                            <div class="file-path">${filePath}</div>
                            <button class="copy-btn" onclick="copyToClipboard('${filePath}', this)">
                                📋 Copy Path
                            </button>
                        </div>
                    `;
                }).join('');
            }

            // Render video files
            if (files.videos.length > 0) {
                videoSection.style.display = 'block';
                const videoList = document.getElementById('videoList');
                videoList.innerHTML = files.videos.map(file => {
                    const filePath = `vid/${file}`;
                    return `
                        <div class="file-item">
                            <div class="file-name">
                                <span class="icon video-icon">🎬</span>
                                ${file}
                            </div>
                            <video controls class="video-player">
                                <source src="${filePath}" type="video/mp4">
                                Browser tidak mendukung video player
                            </video>
                            <div class="file-path">${filePath}</div>
                            <button class="copy-btn" onclick="copyToClipboard('${filePath}', this)">
                                📋 Copy Path
                            </button>
                        </div>
                    `;
                }).join('');
            }
        }

        // Jalankan render saat halaman dimuat
        document.addEventListener('DOMContentLoaded', renderFiles);
    </script>
</body>

</html>
